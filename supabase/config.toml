# Minimal on purpose.
#
# `supabase config push` leaves undeclared properties alone, so this file
# declares ONLY the auth redirect settings. A full `supabase init` template
# would also declare storage, realtime and oauth toggles it invented locally,
# and pushing those would silently overwrite real hosted settings.
#
# WHY THIS EXISTS: password recovery on the deployed site was redirecting to
# http://localhost:3000 — the project's default Site URL — so every student's
# reset link would have bounced to a dead address.

project_id = "pcctpzvhakdutzzwpmsh"

[auth]
# The UI asks for 8 and the server accepted 6, so a 6-character password could
# be set by anything that talked to the endpoint directly while the form said
# otherwise. One number, in one place.
minimum_password_length = 8
site_url = "https://orbit-bits.vercel.app"
additional_redirect_urls = [
  "https://orbit-bits.vercel.app",
  "https://orbit-bits.vercel.app/account",
  "http://localhost:3100",
  "http://localhost:3100/account",
]

[auth.email]

# Sign-up returns NO session while confirmations are on: the student is told to
# check an inbox, and Supabase's built-in SMTP is rate-limited and on newer
# projects delivers only to members of the Supabase organisation. So for
# everyone else "check your inbox" never resolves and the portal cannot be
# entered at all.
#
# THE TRADE, stated plainly: without confirmation, someone can register a campus
# address they do not own. What still holds is that it must BE a campus address
# (db/019 enforces that in the database), and that row-level security — which
# does not care how anyone signed up — is what guards the data. For a campus
# portal with per-user RLS that is an acceptable trade. BEFORE THIS CARRIES
# ANYTHING SENSITIVE, configure real SMTP and set this back to true.
enable_confirmations = false

# One attempt a minute produced "For security purposes, you can only request
# this after 40 seconds" for a student who simply mistyped their password and
# tried again — and at a demo, several people share one network. Ten seconds
# still blocks scripted abuse without punishing a typo.
max_frequency = "10s"
