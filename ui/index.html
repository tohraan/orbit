<title>Research Opportunity Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
/* Layout: one app shell — sticky masthead carries the view tabs and the
   currency switch; each view owns the content column below it, and only
   Discover adds a filter rail beside it. Rail folds above the list under 900px. */
:root {
  /* neutrals carry a slight cool-green bias toward the accent, never flat grey */
  --paper:       #f6f8f7;
  --surface:     #ffffff;
  --surface-2:   #eef2f1;
  --surface-3:   #e4ebe8;
  --ink:         #10201d;
  --ink-soft:    #4a605b;
  --ink-faint:   #7b908a;
  --line:        #d9e2df;
  --line-strong: #b9c9c4;
  --accent:      #0f6f5c;
  --accent-soft: #d7ece6;
  --accent-ink:  #ffffff;
  --urgent:      #a3301f;
  --urgent-soft: #f7e0db;
  --soon:        #8a5a09;
  --soon-soft:   #f8ecd4;
  --open:        #1d6b4f;
  --open-soft:   #dcefe4;
  --idle:        #5a6f8a;
  --idle-soft:   #e2e9f2;
  --shadow:      0 1px 2px rgba(16,32,29,.06), 0 8px 24px rgba(16,32,29,.06);
  --shadow-lift: 0 2px 6px rgba(16,32,29,.09), 0 18px 48px rgba(16,32,29,.12);
  --f-display: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --f-body:    'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --f-mono:    'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:#0c1513; --surface:#111d1a; --surface-2:#16241f; --surface-3:#1d2f29;
    --ink:#e8f0ed; --ink-soft:#9db2ac; --ink-faint:#6d837d;
    --line:#223531; --line-strong:#324b45;
    --accent:#4fd1b0; --accent-soft:#10332c; --accent-ink:#06211b;
    --urgent:#ff8d78; --urgent-soft:#3a1b16;
    --soon:#e8b765; --soon-soft:#352713;
    --open:#62c495; --open-soft:#11301f;
    --idle:#9bb3d4; --idle-soft:#1a2432;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
    --shadow-lift:0 2px 8px rgba(0,0,0,.5), 0 20px 56px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper:#0c1513; --surface:#111d1a; --surface-2:#16241f; --surface-3:#1d2f29;
  --ink:#e8f0ed; --ink-soft:#9db2ac; --ink-faint:#6d837d;
  --line:#223531; --line-strong:#324b45;
  --accent:#4fd1b0; --accent-soft:#10332c; --accent-ink:#06211b;
  --urgent:#ff8d78; --urgent-soft:#3a1b16;
  --soon:#e8b765; --soon-soft:#352713;
  --open:#62c495; --open-soft:#11301f;
  --idle:#9bb3d4; --idle-soft:#1a2432;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
  --shadow-lift:0 2px 8px rgba(0,0,0,.5), 0 20px 56px rgba(0,0,0,.45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 16px; padding-block: 0 72px; }
button { font: inherit; cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- masthead ---------- */
header.mast {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.mast-in { max-width: 1280px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 0; }
.mast-row { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-end; }
.brand { min-width: 0; flex: 1 1 280px; }
.eyebrow {
  font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ink-faint); margin: 0 0 4px;
}
h1 {
  font-family: var(--f-display); font-weight: 700; font-size: clamp(22px, 3.6vw, 30px);
  line-height: 1.1; letter-spacing: -.02em; margin: 0; text-wrap: balance;
}
.mast-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface-2); }
.seg button {
  border: 0; background: transparent; color: var(--ink-soft);
  font-size: 12.5px; padding: 5px 11px; font-family: var(--f-mono);
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 500; }
.ghost {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft);
  border-radius: 999px; padding: 5px 12px; font-size: 12.5px;
}
.ghost:hover { border-color: var(--accent); color: var(--accent); }

.stats { display: flex; flex-wrap: wrap; gap: 8px 24px; margin: 12px 0 0; }
.stat { display: flex; flex-direction: column; }
.stat b { font-family: var(--f-mono); font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.stat span { font-size: 11px; color: var(--ink-faint); }
.stat.is-urgent b { color: var(--urgent); }

nav.tabs { display: flex; gap: 2px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button {
  border: 0; background: transparent; color: var(--ink-soft);
  font-family: var(--f-display); font-weight: 600; font-size: 13.5px;
  padding: 9px 13px; border-bottom: 2px solid transparent; white-space: nowrap;
}
nav.tabs button:hover { color: var(--ink); }
nav.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
nav.tabs .n {
  font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-faint);
  background: var(--surface-2); border-radius: 4px; padding: 1px 4px; margin-left: 5px;
  font-variant-numeric: tabular-nums;
}

/* ---------- shared bits ---------- */
.board { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 24px; align-items: start; padding-top: 20px; }
@media (max-width: 900px) { .board { grid-template-columns: minmax(0,1fr); gap: 14px; } }
.rail {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 150px);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: 14px; box-shadow: var(--shadow); min-width: 0; max-height: 72vh; overflow-y: auto;
}
@media (max-width: 900px) { .rail { position: static; max-height: none; } }
.rail h2, .panel h2 {
  font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-faint); margin: 0 0 8px; font-weight: 500;
}
.group + .group { margin-top: 14px; padding-top: 13px; border-top: 1px solid var(--line); }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt {
  font-size: 12.5px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-soft);
  border-radius: 999px; padding: 4px 10px; transition: background .12s, color .12s, border-color .12s;
}
.opt:hover { border-color: var(--accent); color: var(--ink); }
.opt[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.search { position: relative; flex: 1 1 240px; min-width: 0; }
.search input {
  width: 100%; font: inherit; font-size: 14.5px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--r-md); padding: 9px 12px 9px 34px;
}
.search input::placeholder { color: var(--ink-faint); }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-faint); }
select {
  font: inherit; font-size: 13.5px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--r-md); padding: 9px 10px;
}
.count { font-family: var(--f-mono); font-size: 12.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }

.chip {
  font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
  border-radius: var(--r-sm); padding: 2.5px 7px; background: var(--surface-2); color: var(--ink-soft);
  white-space: nowrap; border: 1px solid transparent;
}
.chip.type { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.chip.dl.u-urgent { background: var(--urgent-soft); color: var(--urgent); font-weight: 500; }
.chip.dl.u-soon   { background: var(--soon-soft);   color: var(--soon);   font-weight: 500; }
.chip.dl.u-open   { background: var(--open-soft);   color: var(--open);   font-weight: 500; }
.chip.dl.u-idle   { background: var(--idle-soft);   color: var(--idle);   font-weight: 500; }
.chip.cover { background: var(--open-soft); color: var(--open); }
.chip.fit { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

/* ---------- opportunity card ---------- */
.list { display: grid; gap: 10px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: 14px 15px; display: grid; gap: 9px; min-width: 0; border-left: 3px solid var(--line);
}
.card.u-urgent { border-left-color: var(--urgent); }
.card.u-soon   { border-left-color: var(--soon); }
.card.u-open   { border-left-color: var(--open); }
.card.u-idle   { border-left-color: var(--line-strong); }
.card.is-picked { box-shadow: 0 0 0 2px var(--accent) inset; }
.card-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.card h3 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 16.5px; line-height: 1.28; letter-spacing: -.01em; }
.card h3 a { color: inherit; text-decoration: none; }
.card h3 a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.sum { margin: 0; font-size: 13.5px; color: var(--ink-soft); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12.5px; color: var(--ink-faint); }
.meta .k { font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--ink-soft); }
.src { display: inline-flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.tier { font-family: var(--f-mono); font-size: 9.5px; border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 4px; color: var(--ink-faint); }
.tier.t1 { border-color: var(--accent); color: var(--accent); }
.host { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-faint); }
.elig {
  margin: 0; font-size: 12.5px; color: var(--ink-soft);
  background: var(--surface-2); border-radius: var(--r-md); padding: 8px 10px;
}
.elig .body {
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  overflow: hidden; overflow-wrap: anywhere;
}
.elig > span.lbl, .blk span.lbl {
  display: block; font-family: var(--f-mono); font-size: 10px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-faint); margin-bottom: 3px;
}
.covers { display: flex; flex-wrap: wrap; gap: 5px; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.acts .spacer { flex: 1 1 auto; }
.act {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft);
  border-radius: var(--r-sm); padding: 4px 9px; font-size: 12px;
}
.act:hover { border-color: var(--accent); color: var(--accent); }
.act[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.apply {
  font-size: 12.5px; font-weight: 600; color: var(--accent); text-decoration: none; white-space: nowrap;
  border: 1px solid var(--accent); border-radius: var(--r-sm); padding: 4px 10px;
}
.apply:hover { background: var(--accent); color: var(--accent-ink); }

/* ---------- detail drawer inside a card ---------- */
.detail { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 11px; }
.blk { font-size: 13px; color: var(--ink-soft); min-width: 0; }
.blk p { margin: 0; }
.blk-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 11px; }
.prov { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-faint); display: grid; gap: 3px; }
.prov b { color: var(--ink-soft); font-weight: 500; }
.amts { display: flex; flex-wrap: wrap; gap: 6px; }
.amt { font-family: var(--f-mono); font-size: 12px; background: var(--surface-2); border-radius: var(--r-sm); padding: 3px 8px; font-variant-numeric: tabular-nums; }
.amt.aed { background: var(--accent-soft); color: var(--accent); }

/* ---------- experiences ---------- */
.exp { display: grid; gap: 8px; }
.exp-item { background: var(--surface-2); border-radius: var(--r-md); padding: 9px 11px; font-size: 13px; }
.exp-item .who { font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-faint); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }
.exp-form { display: grid; gap: 7px; }
.exp-form textarea, .f-field input, .f-field textarea, .exp-form input, .exp-form select {
  font: inherit; font-size: 13.5px; width: 100%; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--r-md); padding: 8px 10px; resize: vertical;
}
.exp-row { display: flex; flex-wrap: wrap; gap: 7px; }
.exp-row > * { flex: 1 1 130px; min-width: 0; }
.note-priv { font-size: 11.5px; color: var(--ink-faint); }

/* ---------- timeline ---------- */
.tl { display: grid; gap: 16px; padding-top: 20px; }
.tl-band { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.tl-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; padding: 11px 14px; border-bottom: 1px solid var(--line); }
.tl-head h3 { margin: 0; font-family: var(--f-display); font-size: 15px; font-weight: 600; }
.tl-head .n { font-family: var(--f-mono); font-size: 12px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.tl-head .bar { flex: 1 1 80px; height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden; min-width: 60px; }
.tl-head .bar i { display: block; height: 100%; }
.tl-rows { display: grid; }
.tl-row { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; padding: 9px 14px; border-top: 1px solid var(--line); font-size: 13.5px; }
.tl-row:first-child { border-top: 0; }
.tl-row .when { font-family: var(--f-mono); font-size: 12px; min-width: 92px; font-variant-numeric: tabular-nums; }
.tl-row .ttl { flex: 1 1 240px; min-width: 0; }
.tl-row .ttl a { color: var(--ink); text-decoration: none; }
.tl-row .ttl a:hover { color: var(--accent); text-decoration: underline; }

/* ---------- kanban ---------- */
.kan { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 12px; overflow-x: auto; padding: 20px 0 8px; align-items: start; }
@media (max-width: 760px) { .kan { grid-auto-flow: row; grid-auto-columns: auto; overflow-x: visible; } }
.kcol { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 10px; min-width: 0; display: grid; gap: 8px; align-content: start; }
.kcol.drop { outline: 2px dashed var(--accent); outline-offset: -3px; }
.kcol > header { display: flex; gap: 8px; align-items: center; }
.kcol h3 { margin: 0; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); font-weight: 500; }
.kcol .n { font-family: var(--f-mono); font-size: 11px; color: var(--ink-faint); margin-left: auto; font-variant-numeric: tabular-nums; }
.kcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 9px 10px; display: grid; gap: 6px; cursor: grab; }
.kcard:active { cursor: grabbing; }
.kcard h4 { margin: 0; font-family: var(--f-display); font-size: 13.5px; font-weight: 600; line-height: 1.3; }
.kcard h4 a { color: inherit; text-decoration: none; }
.kcard .kmeta { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.kmove { display: flex; gap: 4px; }
.kmove button { border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-soft); border-radius: 5px; font-size: 11px; padding: 2px 7px; }
.kmove button:hover { border-color: var(--accent); color: var(--accent); }

/* ---------- compare ---------- */
.cmp-wrap { overflow-x: auto; padding-top: 20px; }
table.cmp { border-collapse: collapse; width: 100%; min-width: 560px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
table.cmp th, table.cmp td { text-align: left; vertical-align: top; padding: 10px 12px; border-top: 1px solid var(--line); font-size: 13.5px; }
table.cmp thead th { border-top: 0; font-family: var(--f-display); font-size: 14px; }
table.cmp tbody th {
  font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-faint); font-weight: 500; width: 128px; white-space: nowrap;
}
table.cmp td.best { background: var(--accent-soft); }

/* ---------- profile ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; box-shadow: var(--shadow); }
.pg { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; padding-top: 20px; align-items: start; }
.f-field { display: grid; gap: 6px; margin-bottom: 13px; }
.f-field > label { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); }
.f-hint { font-size: 11.5px; color: var(--ink-faint); }
.save-row { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  border-radius: var(--r-md); padding: 8px 15px; font-size: 13.5px; font-weight: 600;
}
.btn:hover { filter: brightness(1.08); }
.btn.sec { background: var(--surface); color: var(--accent); }
.said { font-size: 12.5px; color: var(--open); }

/* ---------- advisor ---------- */
.adv-open {
  position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 50;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  border-radius: 999px; padding: 11px 17px; font-family: var(--f-display); font-weight: 600; font-size: 14px;
  box-shadow: var(--shadow-lift); display: inline-flex; gap: 8px; align-items: center;
}
.adv {
  position: fixed; inset: auto 0 0 auto; z-index: 60; width: min(420px, 100vw);
  height: min(620px, 100%); display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg) 0 0 0;
  box-shadow: var(--shadow-lift); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (max-width: 520px) { .adv { width: 100vw; height: 86%; border-radius: var(--r-lg) var(--r-lg) 0 0; } }
.adv > header { display: flex; gap: 9px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.adv > header h2 { margin: 0; font-family: var(--f-display); font-size: 15px; font-weight: 600; letter-spacing: -.01em; text-transform: none; color: var(--ink); }
.adv > header .x { margin-left: auto; border: 0; background: transparent; color: var(--ink-faint); font-size: 20px; line-height: 1; padding: 2px 6px; }
.adv-log { flex: 1 1 auto; overflow-y: auto; padding: 14px; display: grid; gap: 11px; align-content: start; }
.msg { font-size: 13.5px; max-width: 94%; }
.msg.me { justify-self: end; background: var(--accent-soft); color: var(--accent); border-radius: var(--r-md) var(--r-md) 2px var(--r-md); padding: 8px 11px; }
.msg.ai { justify-self: start; background: var(--surface-2); border-radius: var(--r-md) var(--r-md) var(--r-md) 2px; padding: 9px 11px; white-space: pre-wrap; }
.msg.ai .ref {
  display: inline-block; font-family: var(--f-mono); font-size: 11px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; margin: 0 1px; color: var(--accent); cursor: pointer;
}
.adv-seed { display: flex; flex-wrap: wrap; gap: 6px; }
.adv-foot { border-top: 1px solid var(--line); padding: 10px 12px; display: grid; gap: 7px; }
.adv-foot .row { display: flex; gap: 7px; align-items: flex-end; }
.adv-foot textarea { flex: 1 1 auto; min-width: 0; font: inherit; font-size: 13.5px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 8px 10px; resize: none; height: 42px; }

/* ---------- states ---------- */
.empty, .loading {
  text-align: center; padding: 46px 20px; border: 1px dashed var(--line-strong);
  border-radius: var(--r-lg); color: var(--ink-soft); background: var(--surface);
}
.empty b, .loading b { display: block; font-family: var(--f-display); font-size: 17px; color: var(--ink); margin-bottom: 6px; }
.empty p, .loading p { margin: 0 auto; max-width: 46ch; font-size: 13.5px; }
.skel { display: grid; gap: 10px; }
.skel > div { height: 112px; border-radius: var(--r-lg); background: linear-gradient(100deg, var(--surface) 30%, var(--surface-2) 50%, var(--surface) 70%); background-size: 240% 100%; animation: sweep 1.4s linear infinite; border: 1px solid var(--line); }
@keyframes sweep { to { background-position: -140% 0; } }
.more { font-size: 14px; width: 100%; padding: 11px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-md); }
.more:hover { border-color: var(--accent); color: var(--accent); }
footer.note { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--ink-faint); }
footer.note code { font-family: var(--f-mono); font-size: 11.5px; }
footer.note p { margin: 0 0 7px; max-width: 78ch; }
.banner {
  margin-top: 12px; background: var(--soon-soft); color: var(--soon); border-radius: var(--r-md);
  padding: 9px 12px; font-size: 12.5px;
}

<script>
(function () {
  'use strict';

  /* ===== constants ====================================================== */

  var TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);

  /* AED is pegged to the dollar at 3.6725 by the UAE central bank and has been
     since 1997, so the USD column is exact. EUR and GBP are indicative only:
     the page cannot reach an FX service (the artifact frame blocks network
     calls to other hosts), so these are fixed and dated, not live. */
  var FX_AS_OF = '2026-10-01';
  var FX = { USD: 3.6725, EUR: 4.30, GBP: 4.95, AED: 1, CAD: 2.70, AUD: 2.45, CHF: 4.60, SGD: 2.85, INR: 0.0415, JPY: 0.0245 };
  var FX_EXACT = { USD: 1, AED: 1 };

  var STAGES = [
    { k: 'interested', label: 'Interested',  tone: 'idle' },
    { k: 'preparing',  label: 'Preparing',   tone: 'soon' },
    { k: 'submitted',  label: 'Submitted',   tone: 'open' },
    { k: 'interview',  label: 'Interview',   tone: 'open' },
    { k: 'decided',    label: 'Decided',     tone: 'idle' }
  ];

  var LEVELS  = [['', 'Any'], ['bachelors', "Bachelor's"], ['masters', "Master's"], ['phd', 'PhD'], ['postdoc', 'Postdoc']];
  var TYPES   = [['', 'Any'], ['scholarship', 'Scholarship'], ['fellowship', 'Fellowship'], ['research_internship', 'Research internship'], ['internship', 'Internship'], ['grant', 'Grant'], ['summer_school', 'Summer school'], ['competition', 'Competition'], ['training', 'Training'], ['exchange', 'Exchange'], ['award', 'Award']];
  var FUNDS   = [['', 'Any'], ['fully_funded', 'Fully funded'], ['partially_funded', 'Partial'], ['stipend_only', 'Stipend'], ['tuition_waiver', 'Tuition'], ['paid', 'Paid']];
  var WHENS   = [['', 'Any'], ['30', 'Next 30 days'], ['90', 'Next 90 days'], ['year', 'By 31 Dec'], ['dated', 'Has a date'], ['rolling', 'Rolling / open']];
  var TIERS   = [['', 'Any'], ['1', 'Tier 1 funder'], ['2', 'Tier 2 national'], ['3', 'Tier 3 aggregator']];
  var DETAIL  = [['', 'Any'], ['apply', 'Has apply link'], ['elig', 'Has eligibility'], ['money', 'Has an amount']];

  var VIEWS = [
    { k: 'discover', label: 'Discover' },
    { k: 'timeline', label: 'Timeline' },
    { k: 'compare',  label: 'Compare' },
    { k: 'tracker',  label: 'Tracker' },
    { k: 'saved',    label: 'Saved' },
    { k: 'profile',  label: 'Profile' }
  ];

  var PAGE = 50;

  /* ===== state ========================================================== */

  var DATA = [], BY_ID = {}, VIEW = [], shown = 0, STALE = 0, INDEX_FROM = null;
  var state = {
    view: 'discover', cur: 'src',
    level: '', type: '', fund: '', when: '', tier: '', detail: '', country: '', q: '', sort: 'deadline',
    open: {}, picked: [], saved: {}, stages: {}, profile: null, exps: {}, turns: []
  };
  var caps = { db: null, user: null, sample: null, downloads: null, uid: null };
  var writing = {};

  /* ===== small helpers ================================================== */

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function $(id) { return document.getElementById(id); }
  function titleCase(s) { return String(s || '').replace(/_/g, ' ').replace(/\b\w/g, function (m) { return m.toUpperCase(); }); }
  function days(d) {
    if (!d) return null;
    var t = new Date(d + 'T00:00:00');
    return isNaN(t) ? null : Math.round((t - TODAY) / 86400000);
  }
  function urgency(n) {
    if (n === null) return 'idle';
    if (n < 0) return 'idle';
    if (n <= 7) return 'urgent';
    if (n <= 30) return 'soon';
    return 'open';
  }
  function isoToday() {
    var m = TODAY.getMonth() + 1, d = TODAY.getDate();
    return TODAY.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (d < 10 ? '0' : '') + d;
  }
  function fmtDate(s) {
    if (!s) return '';
    var t = new Date(String(s).length <= 10 ? s + 'T00:00:00' : s);
    return isNaN(t) ? '' : t.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function deadlineLabel(o) {
    var n = days(o.d);
    if (n === null) return o.dk === 'rolling' ? 'Rolling' : (o.dk === 'varies' ? 'Varies by course' : 'No date published');
    if (n < 0) return 'Closed';
    if (n === 0) return 'Closes today';
    if (n === 1) return 'Closes tomorrow';
    if (n <= 60) return n + ' days left';
    return fmtDate(o.d);
  }

  /* money. `m` is {c, v, p}; AED mode converts and says so. */
  function fmtMoney(m) {
    if (!m || !m.v) return '';
    var cur = m.c || '', v = m.v;
    if (state.cur === 'aed' && cur && FX[cur]) {
      v = Math.round(m.v * FX[cur]);
      cur = 'AED';
    }
    var n = v >= 1000 ? Math.round(v).toLocaleString() : (Math.round(v * 100) / 100).toLocaleString();
    return (cur ? cur + ' ' : '') + n + (m.p ? '/' + m.p : '');
  }
  function fxNote(m) {
    if (state.cur !== 'aed' || !m || !m.c || m.c === 'AED') return '';
    if (!FX[m.c]) return ' (no rate for ' + esc(m.c) + ')';
    return FX_EXACT[m.c] ? ' (pegged)' : ' (indicative)';
  }

  /* ===== fit score ====================================================== */

  function fit(o) {
    var p = state.profile;
    if (!p) return null;
    var score = 0, max = 0;
    max += 40;
    if (p.level) {
      var lv = o.lv || [];
      if (lv.indexOf(p.level) >= 0) score += 40;
      else if (!lv.length) score += 14;
    } else score += 20;
    max += 25;
    var fields = (p.fields || '').toLowerCase().split(/[,;]+/).map(function (s) { return s.trim(); }).filter(Boolean);
    if (fields.length) {
      var hay = ((o.t || '') + ' ' + (o.g || '') + ' ' + (o.fs || []).join(' ')).toLowerCase();
      var hits = fields.filter(function (f) { return hay.indexOf(f) >= 0; }).length;
      score += Math.min(25, hits * 13);
    } else score += 12;
    max += 20;
    if (p.funding) {
      if (o.f === 'fully_funded') score += 20;
      else if (o.f === 'stipend_only' || o.f === 'paid' || o.f === 'partially_funded' || o.f === 'tuition_waiver') score += 12;
      else if (o.a) score += 8;
    } else score += 10;
    max += 15;
    var want = (p.countries || '').toLowerCase().split(/[,;]+/).map(function (s) { return s.trim(); }).filter(Boolean);
    if (want.length && o.c) {
      score += want.some(function (w) { return String(o.c).toLowerCase().indexOf(w) >= 0; }) ? 15 : 0;
    } else score += 7;
    return Math.round((score / max) * 100);
  }

  /* ===== filtering ====================================================== */

  function matches(o) {
    var n = days(o.d);
    if (n !== null && n < 0) return false;                 /* stale: never shown */
    if (state.level && (o.lv || []).indexOf(state.level) < 0) return false;
    if (state.type && o.ty !== state.type) return false;
    if (state.fund && String(o.f || '') !== state.fund) return false;
    if (state.tier && String(o.st || '') !== state.tier) return false;
    if (state.country && String(o.c || '') !== state.country) return false;
    if (state.detail === 'apply' && !o.ap) return false;
    if (state.detail === 'elig' && !o.el) return false;
    if (state.detail === 'money' && !o.a) return false;
    if (state.when) {
      if (state.when === 'rolling') { if (o.d) return false; }
      else if (state.when === 'dated') { if (!o.d) return false; }
      else if (state.when === 'year') { if (!o.d || o.d > (TODAY.getFullYear() + '-12-31')) return false; }
      else if (n === null || n > Number(state.when)) return false;
    }
    if (state.q) {
      var hay = ((o.t || '') + ' ' + (o.g || '') + ' ' + (o.c || '') + ' ' + (o.sn || '') + ' ' +
                 (o.fs || []).join(' ') + ' ' + (o.ty || '') + ' ' + (o.h || '')).toLowerCase();
      if (hay.indexOf(state.q) < 0) return false;
    }
    return true;
  }

  function sortView(a, b) {
    if (state.sort === 'title')  return (a.t || '').localeCompare(b.t || '');
    if (state.sort === 'source') return (a.sn || '').localeCompare(b.sn || '') || (a.t || '').localeCompare(b.t || '');
    if (state.sort === 'posted') return String(b.pa || '').localeCompare(String(a.pa || ''));
    if (state.sort === 'fit')    return (fit(b) || 0) - (fit(a) || 0) || String(a.d || '9').localeCompare(String(b.d || '9'));
    var x = a.d, y = b.d;
    if (!x && !y) return (a.t || '').localeCompare(b.t || '');
    if (!x) return 1;
    if (!y) return -1;
    return state.sort === 'deadline-far' ? (y < x ? -1 : 1) : (x < y ? -1 : 1);
  }

  /* ===== cards ========================================================== */

  function chips(o) {
    var n = days(o.d), u = urgency(n), out = '';
    if (o.ty) out += '<span class="chip type">' + esc(titleCase(o.ty)) + '</span>';
    out += '<span class="chip dl u-' + u + '">' + esc(deadlineLabel(o)) + '</span>';
    (o.lv || []).forEach(function (l) { out += '<span class="chip">' + esc(titleCase(l)) + '</span>'; });
    if (o.f) out += '<span class="chip">' + esc(titleCase(o.f)) + '</span>';
    var f = fit(o);
    if (f !== null) out += '<span class="chip fit" title="How well this matches your profile">' + f + '% fit</span>';
    return out;
  }

  function metaLine(o) {
    var bits = [];
    if (o.c) bits.push('<span>' + esc(titleCase(o.c)) + '</span>');
    if (o.du) bits.push('<span class="k">' + esc(o.du) + '</span>');
    var money = fmtMoney(o.a);
    if (money) bits.push('<span class="k" title="' + (o.a.raw ? esc(o.a.raw) + ' as published' : '') + '">' + esc(money) + esc(fxNote(o.a)) + '</span>');
    if ((o.fs || []).length) bits.push('<span>' + esc(o.fs.slice(0, 2).join(', ')) + '</span>');
    return '<span class="src">' + esc(o.sn) +
      (o.st ? ' <span class="tier' + (String(o.st) === '1' ? ' t1' : '') + '">T' + esc(o.st) + '</span>' : '') +
      (o.h ? ' <span class="host">' + esc(o.h) + '</span>' : '') + '</span>' +
      (o.pa ? '<span class="k" title="Published by the source">posted ' + esc(fmtDate(o.pa)) + '</span>' : '') +
      bits.join('');
  }

  function cardHTML(o) {
    var u = urgency(days(o.d));
    var isSaved = !!state.saved[o.i], isPicked = state.picked.indexOf(o.i) >= 0, isOpen = !!state.open[o.i];
    return '<article class="card u-' + u + (isPicked ? ' is-picked' : '') + '" data-id="' + o.i + '">' +
      '<div class="card-top">' + chips(o) + '</div>' +
      '<h3><a href="' + esc(o.u) + '" target="_blank" rel="noopener noreferrer">' + esc(o.t) + '</a></h3>' +
      (o.g ? '<p class="sum">' + esc(o.g) + '</p>' : '') +
      (o.el ? '<p class="elig"><span class="lbl">Eligibility</span><span class="body">' + esc(o.el) + '</span></p>' : '') +
      ((o.cv || []).length ? '<div class="covers">' + o.cv.map(function (c) {
          return '<span class="chip cover">' + esc(titleCase(c)) + '</span>'; }).join('') + '</div>' : '') +
      '<div class="meta">' + metaLine(o) + '</div>' +
      '<div class="acts">' +
        '<button class="act" type="button" data-a="detail" aria-pressed="' + isOpen + '">' + (isOpen ? 'Hide details' : 'Details') + '</button>' +
        '<button class="act" type="button" data-a="save" aria-pressed="' + isSaved + '">' + (isSaved ? 'Saved' : 'Save') + '</button>' +
        '<button class="act" type="button" data-a="pick" aria-pressed="' + isPicked + '">' + (isPicked ? 'In compare' : 'Compare') + '</button>' +
        '<button class="act" type="button" data-a="track">' + (state.stages[o.i] ? 'Tracked &middot; ' + esc(stageLabel(state.stages[o.i])) : 'Track') + '</button>' +
        '<span class="spacer"></span>' +
        (o.ap ? '<a class="apply" href="' + esc(o.ap) + '" target="_blank" rel="noopener noreferrer">Apply &rarr;</a>'
              : '<a class="apply" href="' + esc(o.u) + '" target="_blank" rel="noopener noreferrer">Open source &rarr;</a>') +
      '</div>' +
      (isOpen ? detailHTML(o) : '') +
    '</article>';
  }

  function stageLabel(k) {
    for (var i = 0; i < STAGES.length; i++) if (STAGES[i].k === k) return STAGES[i].label;
    return k;
  }

  /* ===== detail panel =================================================== */

  function blk(label, body) {
    if (!body) return '';
    return '<div class="blk"><span class="lbl">' + esc(label) + '</span><p>' + esc(body) + '</p></div>';
  }

  function priorEditions(o) {
    var stem = String(o.t || '')
      .replace(/\b(19|20)\d{2}\s*[-–\/]\s*\d{2,4}\b|\b(19|20)\d{2}\b/g, ' ')
      .replace(/[^a-z0-9 ]/gi, ' ').replace(/\s+/g, ' ').trim().toLowerCase();
    if (stem.length < 12) return [];
    return DATA.filter(function (x) {
      if (x.i === o.i) return false;
      var s2 = String(x.t || '')
        .replace(/\b(19|20)\d{2}\s*[-–\/]\s*\d{2,4}\b|\b(19|20)\d{2}\b/g, ' ')
        .replace(/[^a-z0-9 ]/gi, ' ').replace(/\s+/g, ' ').trim().toLowerCase();
      return s2 === stem;
    });
  }

  function detailHTML(o) {
    var amts = (o.am || []).length ? o.am : (o.a ? [o.a] : []);
    var amtHTML = amts.length
      ? '<div class="blk"><span class="lbl">Figures published on the page</span><div class="amts">' +
        amts.map(function (m) {
          var src = (m.c ? m.c + ' ' : '') + Math.round(m.v).toLocaleString() + (m.p ? '/' + m.p : '');
          var aed = m.c && FX[m.c] && m.c !== 'AED'
            ? '<span class="amt aed">AED ' + Math.round(m.v * FX[m.c]).toLocaleString() + (m.p ? '/' + m.p : '') + (FX_EXACT[m.c] ? '' : ' approx') + '</span>'
            : '';
          return '<span class="amt">' + esc(src) + '</span>' + aed;
        }).join('') + '</div></div>'
      : '';

    var prior = priorEditions(o);
    var hist = '<div class="blk"><span class="lbl">Earlier rounds</span>' + (prior.length
      ? '<div class="amts">' + prior.map(function (x) {
          return '<a class="amt" href="' + esc(x.u) + '" target="_blank" rel="noopener noreferrer">' + esc((x.t.match(/(19|20)\d{2}/) || ['earlier'])[0]) + ' edition</a>';
        }).join('') + '</div>'
      : '<p>No earlier round of this programme is in the index yet. The index began ' +
        esc(INDEX_FROM ? fmtDate(INDEX_FROM) : 'recently') +
        ', so past-year data will appear here only as later rounds are collected. Nothing is inferred.</p>') + '</div>';

    var provenance = '<div class="blk"><span class="lbl">Where this came from</span><div class="prov">' +
      '<div><b>Source</b> ' + esc(o.sn) + (o.st ? ' (tier ' + esc(o.st) + ')' : '') + '</div>' +
      (o.h ? '<div><b>Domain</b> ' + esc(o.h) + '</div>' : '') +
      (o.pa ? '<div><b>Posted</b> ' + esc(fmtDate(o.pa)) + '</div>' : '<div><b>Posted</b> not published by the source</div>') +
      (o.fi ? '<div><b>Indexed</b> ' + esc(fmtDate(o.fi)) + '</div>' : '') +
      (o.dn ? '<div><b>Deadline note</b> ' + esc(o.dn) + '</div>' : '') +
      '</div></div>';

    var deep = (o.el || o.bn || o.ht || o.dc)
      ? '<div class="blk-grid">' + blk('Eligibility', o.el) + blk('What it covers', o.bn) +
        blk('How to apply', o.ht) + blk('Documents needed', o.dc) + '</div>'
      : '<div class="empty" style="padding:22px"><b>No page detail collected yet</b><p>This listing has not had its source page read. ' +
        'The title, deadline and funding above come from the source feed. Open the source for the full text.</p></div>';

    return '<div class="detail">' + deep + amtHTML + hist + provenance + expHTML(o) + '</div>';
  }

  /* ===== experiences (shared db) ======================================== */

  function expHTML(o) {
    var items = state.exps[o.i] || [];
    var list = items.length
      ? '<div class="exp">' + items.map(function (e) {
          return '<div class="exp-item"><div class="who">' +
            esc([e.year, e.outcome ? titleCase(e.outcome) : '', e.programme || ''].filter(Boolean).join(' · ') || 'Shared experience') +

  /* ===== calendar reminders ============================================= */

  function icsFor(list) {
    function stamp(d) { return String(d).replace(/-/g, ''); }
    /* An all-day DTEND is the day AFTER the deadline. Build it from local
       components: toISOString() would convert local midnight to UTC and hand
       back the previous day for every viewer east of Greenwich, Dubai included. */
    function plusDay(d) {
      var t = new Date(d + 'T00:00:00'); t.setDate(t.getDate() + 1);
      var m = t.getMonth() + 1, day = t.getDate();
      return String(t.getFullYear()) + (m < 10 ? '0' : '') + m + (day < 10 ? '0' : '') + day;
    }
    var lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Research Opportunity Finder//EN', 'CALSCALE:GREGORIAN'];
    list.forEach(function (o) {
      if (!o.d) return;
      var text = String(o.t || '').replace(/[\r\n]+/g, ' ').replace(/([,;\\])/g, '\\$1');
      var desc = ((o.ap || o.u) + ' — ' + (o.sn || '')).replace(/([,;\\])/g, '\\$1');
      lines.push('BEGIN:VEVENT',
        'UID:rof-' + o.i + '@research-opportunity-finder',
        'DTSTAMP:' + stamp(isoToday()) + 'T090000Z',
        'DTSTART;VALUE=DATE:' + stamp(o.d),
        'DTEND;VALUE=DATE:' + plusDay(o.d),
        'SUMMARY:Deadline — ' + text,
        'DESCRIPTION:' + desc,
        'URL:' + (o.ap || o.u),
        'BEGIN:VALARM', 'TRIGGER:-P7D', 'ACTION:DISPLAY', 'DESCRIPTION:Closes in a week', 'END:VALARM',
        'BEGIN:VALARM', 'TRIGGER:-P1D', 'ACTION:DISPLAY', 'DESCRIPTION:Closes tomorrow', 'END:VALARM',
        'END:VEVENT');
    });
    lines.push('END:VCALENDAR');
    return lines.join('\r\n');
  }

  async function saveIcs(list, filename) {
    if (!caps.downloads) return;
    var dated = list.filter(function (o) { return o.d; });
    if (!dated.length) return;
    try {
      await caps.downloads.save({ filename: filename, data: icsFor(dated) });
    } catch (e) {
      if (e && e.code !== 'declined' && e.code !== 'cancelled') {
        toast('Calendar file could not be saved in this view.');
      }
    }
  }

  function toast(msg) {

    if (el) { el.textContent = msg; setTimeout(function () { if (el.textContent === msg) el.textContent = ''; }, 4000); }

  /* ===== persistence ==================================================== */

  /* One write at a time per document: chain per path. */
  function write(path, data) {
    if (!caps.db) return Promise.resolve();
    var prev = writing[path] || Promise.resolve();
    var next = prev.catch(function () {}).then(function () {
      return caps.db.doc(path).set(data);
    }).catch(function () { /* revoked or offline: the page keeps working */ });
    writing[path] = next;
    return next;
  }
  function mine(name) { return 'data/users/' + caps.uid + '/' + name; }

  function persistSaved()  { if (caps.uid) write(mine('saved'),   { ids: state.saved }); }
  function persistStages() { if (caps.uid) write(mine('tracker'), { stages: state.stages }); }
  function persistProfile(){ if (caps.uid) write(mine('profile'), state.profile || {}); }

  /* ===== advisor ======================================================== */

  var advCtl = null;

  function advLine(role, text) {
    var log = $('adv-log');
    var div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'me' : 'ai');
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  function shortlistFor(q) {
    var words = String(q || '').toLowerCase().split(/\W+/).filter(function (w) { return w.length > 3; });
    var pool = DATA.filter(function (o) { var n = days(o.d); return n === null || n >= 0; });
    return pool.map(function (o) {
      var s = (fit(o) || 45);
      if (words.length) {
        var hay = ((o.t || '') + ' ' + (o.g || '') + ' ' + (o.fs || []).join(' ') + ' ' + (o.c || '') + ' ' + (o.ty || '')).toLowerCase();
        s += words.filter(function (w) { return hay.indexOf(w) >= 0; }).length * 22;
      }
      if (o.d) s += 6;
      if (o.el) s += 4;
      return { o: o, s: s };
    }).sort(function (a, b) { return b.s - a.s; }).slice(0, 28).map(function (x) { return x.o; });
  }

  function brief(list) {
    return list.map(function (o) {
      return [
        '#' + o.i,
        o.t,
        o.ty || 'type unknown',
        (o.lv || []).join('/') || 'level unknown',
        o.d ? 'closes ' + o.d : (o.dk || 'no date'),
        o.f || 'funding unknown',
        fmtMoney(o.a) || 'amount not published',
        o.c || 'country unknown',
        o.sn
      ].join(' | ');
    }).join('\n');
  }

  var RULES = [
    'You are the advisor inside a research-opportunity finder used by students at BITS Pilani Dubai.',
    'Almost all of them are Indian nationals studying engineering on a UAE campus.',
    '',
    'Rules you must follow:',
    '1. Recommend ONLY from the shortlist given to you in the same message. Never invent a programme, a deadline, an amount or a URL.',
    '2. Refer to an opportunity by its #id exactly as given, e.g. #14821. The page turns those into links.',
    '3. If the shortlist does not answer the question, say so plainly and say what is missing from the index.',
    '4. Deadlines and amounts are only as good as the source feed. Where a field says unknown, say it is not published rather than guessing.',
    '5. Warn when a programme likely requires enrolment at an institution in India, because a Dubai campus often fails that test. Do not assert it; flag it as something to check.',
    '6. Be short. Three or four recommendations, one or two sentences each, then one line on what to check next.',
    '7. Never promise eligibility. Tell them to read the eligibility text on the source page.'
  ].join('\n');

  async function advAsk(q) {
    if (!caps.sample) return;
    advLine('user', q);
    $('adv-in').value = '';
    var bubble = advLine('ai', 'Thinking…');
    var list = shortlistFor(q);
    var p = state.profile;
    var who = p
      ? 'Student profile: level ' + (p.level || 'unknown') + '; fields ' + (p.fields || 'unstated') +
        '; countries ' + (p.countries || 'any') + '; nationality ' + (p.nationality || 'unstated') +
        '; funding ' + (p.funding === false ? 'not essential' : 'required') + '; graduates ' + (p.grad || 'unstated') + '.'
      : 'The student has not filled in a profile. Ask one short question about their degree level and field before recommending, unless the message already says.';

    state.turns.push({ role: 'user', content: q });
    var turns = state.turns.slice(-8);
    var input = [{ role: 'user', content: RULES }]
      .concat(turns.slice(0, -1))
      .concat([{ role: 'user', content: who + '\n\nShortlist (id | title | type | levels | deadline | funding | amount | country | source):\n' + brief(list) + '\n\nStudent asks: ' + q }]);

    advCtl = new AbortController();
    $('adv-stop').hidden = false;
    $('adv-send').disabled = true;
    try {
      var res = await caps.sample(input, {
        cache: false, signal: advCtl.signal, modelTier: 'default',
        onText: function (u) { bubble.innerHTML = linkRefs(u.text); $('adv-log').scrollTop = $('adv-log').scrollHeight; }
      });
      bubble.innerHTML = linkRefs(res.text);
      state.turns.push({ role: 'assistant', content: res.text });
    } catch (e) {
      var code = (e && e.code) || 'upstream_error';
      if (code === 'cancelled') { bubble.textContent = (e.text || '') + '\n\n[stopped]'; }
      else if (code === 'not_granted' || code === 'sampling_disabled' || code === 'not_declared') {
        bubble.textContent = 'The advisor needs your permission to ask Claude, and this view does not have it. Everything else on the page works without it.';
        $('adv-send').disabled = true;
      } else if (code === 'rate_limited') {
        bubble.textContent = 'Too many requests just now. Give it a minute and ask again.';
      } else if (code === 'prompt_too_large') {
        bubble.textContent = 'That was too much to send at once. Ask about one thing at a time.';
      } else {
        bubble.textContent = (e && e.text) || 'That did not go through. Try asking again.';
      }
      state.turns.pop();
    } finally {
      $('adv-stop').hidden = true;
      if (caps.sample) $('adv-send').disabled = false;
      advCtl = null;
    }
  }

  function linkRefs(text) {
    return esc(text).replace(/#(\d{2,9})/g, function (m, id) {
      return BY_ID[id] ? '<span class="ref" data-ref="' + id + '">' + esc(BY_ID[id].t.slice(0, 44)) + '</span>' : m;
    });
  }

  /* ===== chrome ========================================================= */

  function buildTabs() {
    $('tabs').innerHTML = VIEWS.map(function (v) {
      var n = v.k === 'saved' ? Object.keys(state.saved).length
            : v.k === 'tracker' ? Object.keys(state.stages).length
            : v.k === 'compare' ? state.picked.length : null;
      return '<button type="button" role="tab" data-view="' + v.k + '" aria-selected="' + (state.view === v.k) + '">' +
        esc(v.label) + (n ? '<span class="n">' + n + '</span>' : '') + '</button>';
    }).join('');
  }

  function buildFilters() {
    var countries = {};
    DATA.forEach(function (o) { if (o.c) countries[o.c] = (countries[o.c] || 0) + 1; });
    var top = Object.keys(countries).sort(function (a, b) { return countries[b] - countries[a]; }).slice(0, 10);
    var defs = [
      ['f-level', LEVELS, 'level'], ['f-type', TYPES, 'type'], ['f-fund', FUNDS, 'fund'],
      ['f-when', WHENS, 'when'], ['f-tier', TIERS, 'tier'], ['f-detail', DETAIL, 'detail'],
      ['f-country', [['', 'Any']].concat(top.map(function (c) { return [c, titleCase(c) + ' (' + countries[c] + ')']; })), 'country']
    ];
    defs.forEach(function (d) {
      $(d[0]).innerHTML = d[1].map(function (o) {
        return '<button class="opt" type="button" data-k="' + d[2] + '" data-v="' + esc(o[0]) + '" aria-pressed="' + (state[d[2]] === o[0]) + '">' + esc(o[1]) + '</button>';
      }).join('');
    });
  }

  function renderStats() {
    var live = DATA.filter(function (o) { var n = days(o.d); return n === null || n >= 0; });
    var dated = live.filter(function (o) { return o.d; });
    var soon = dated.filter(function (o) { var n = days(o.d); return n >= 0 && n <= 30; });
    var eoy = dated.filter(function (o) { return o.d >= isoToday() && o.d <= (TODAY.getFullYear() + '-12-31'); });
    var srcs = {}; live.forEach(function (o) { srcs[o.s] = 1; });
    var items = [
      [live.length.toLocaleString(), 'open calls', ''],
      [soon.length.toLocaleString(), 'within 30 days', 'is-urgent'],
      [eoy.length.toLocaleString(), 'closing by 31 Dec', ''],
      [dated.length.toLocaleString(), 'with a firm date', ''],
      [String(Object.keys(srcs).length), 'sources', '']
    ];
    $('stats').innerHTML = items.map(function (s) {
      return '<div class="stat ' + s[2] + '"><b>' + s[0] + '</b><span>' + s[1] + '</span></div>';
    }).join('');
    $('eyebrow').textContent = 'BITS Pilani Dubai · open calls from ' + Object.keys(srcs).length + ' public sources';
  }

  function switchView(k) {
    state.view = k;
    VIEWS.forEach(function (v) { $('v-' + v.k).hidden = v.k !== k; });
    buildTabs();
    if (k === 'timeline') render_timeline();
    if (k === 'compare')  render_compare();
    if (k === 'tracker')  render_tracker();
    if (k === 'saved')    render_saved();
    if (k === 'profile')  render_profile();
    if (k === 'discover') render(true);
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  function refreshAll() {
    buildTabs();
    if (state.view === 'discover') { var at = shown; render(true); shown = Math.min(Math.max(at, PAGE), VIEW.length); }
    else switchView(state.view);
  }

  function foot() {
    var srcs = {}; DATA.forEach(function (o) { srcs[o.s] = 1; });
    $('foot').innerHTML =
      '<p>Collected by a scheduled n8n workflow from ' + Object.keys(srcs).length + ' public sources — WordPress REST, RSS and JSON APIs — ' +
      'then deduplicated on <code>(source, external_id)</code>. Blog roundups and listings restricted to a nationality our students do not hold ' +
      'are rejected at ingest; registers of already-awarded grants and course catalogues are kept out of this list because there is nothing to apply to.</p>' +
      '<p>Closed opportunities are dropped at ingest and hidden here, and sentinel dates such as <code>2099-01-01</code> are recorded as rolling ' +
      'rather than shown as a deadline. ' + (STALE ? STALE + ' listing' + (STALE === 1 ? '' : 's') + ' in this snapshot had passed and ' + (STALE === 1 ? 'is' : 'are') + ' not shown. ' : '') +
      'Snapshot of ' + DATA.length.toLocaleString() + ' records' + (INDEX_FROM ? ', indexed from ' + fmtDate(INDEX_FROM) : '') + '.</p>' +
      '<p>Dirham figures convert at a fixed table dated ' + FX_AS_OF + '. AED/USD 3.6725 is the central bank peg and is exact; ' +
      'other currencies are indicative, because this page cannot reach a live rates service.</p>';
  }

  /* ===== events ========================================================= */

  document.addEventListener('click', function (e) {
    var t = e.target;

    var tab = t.closest('[data-view]');
    if (tab) { switchView(tab.dataset.view); return; }

    var opt = t.closest('.opt');
    if (opt) {
      state[opt.dataset.k] = opt.dataset.v;
      opt.parentNode.querySelectorAll('.opt').forEach(function (o) { o.setAttribute('aria-pressed', String(o === opt)); });
      render(true);
      return;
    }

    if (t.id === 'clear-filters') {
      ['level', 'type', 'fund', 'when', 'tier', 'detail', 'country'].forEach(function (k) { state[k] = ''; });
      state.q = ''; $('q').value = '';
      buildFilters(); render(true); return;
    }
    if (t.id === 'more') { render(false); return; }
    if (t.id === 'cur-src' || t.id === 'cur-aed') {
      state.cur = t.id === 'cur-aed' ? 'aed' : 'src';
      $('cur-src').setAttribute('aria-pressed', String(state.cur === 'src'));
      $('cur-aed').setAttribute('aria-pressed', String(state.cur === 'aed'));
      refreshAll(); return;
    }
    if (t.id === 'theme') {
      var root = document.documentElement;
      var dark = root.getAttribute('data-theme') === 'dark' ||
        (!root.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
      root.setAttribute('data-theme', dark ? 'light' : 'dark');
      return;
    }
    if (t.id === 'adv-open') { $('adv').hidden = false; $('adv-open').hidden = true; $('adv-in').focus(); return; }
    if (t.id === 'adv-close') { $('adv').hidden = true; $('adv-open').hidden = false; return; }
    if (t.id === 'adv-send') { var v = $('adv-in').value.trim(); if (v) advAsk(v); return; }
    if (t.id === 'adv-stop') { if (advCtl) advCtl.abort(); return; }
    if (t.dataset && t.dataset.seed) { advAsk(t.dataset.seed); return; }
    if (t.dataset && t.dataset.ref) {
      var o = BY_ID[t.dataset.ref];
      if (o) { state.open[o.i] = true; switchView('discover'); setTimeout(function () {
        var el = document.querySelector('.card[data-id="' + o.i + '"]');
        if (el) el.scrollIntoView({ block: 'center' });
      }, 60); }
      return;
    }
    if (t.id === 'ics-all') {
      saveIcs(Object.keys(state.saved).map(function (i) { return BY_ID[i]; }).filter(Boolean), 'opportunity-deadlines.ics');
      return;
    }
    if (t.dataset && t.dataset.unpick) {
      state.picked = state.picked.filter(function (i) { return String(i) !== t.dataset.unpick; });
      render_compare(); buildTabs(); return;
    }
    if (t.dataset && t.dataset.move !== undefined && t.dataset.move !== '') {
      var parts = t.dataset.move.split('|');
      setStage(parts[0], parts[1] || null);
      return;
    }

    var act = t.closest('[data-a]');
    if (act) {
      var card = act.closest('[data-id]');
      if (!card) return;
      var id = card.dataset.id, o2 = BY_ID[id];
      if (!o2) return;
      if (act.dataset.a === 'detail') { state.open[id] = !state.open[id]; recard(id); return; }
      if (act.dataset.a === 'save') {
        if (state.saved[id]) delete state.saved[id]; else state.saved[id] = Date.now();
        persistSaved(); buildTabs();
        if (state.view === 'saved') render_saved(); else recard(id);
        return;
      }
      if (act.dataset.a === 'pick') {
        var at = state.picked.indexOf(id);
        if (at >= 0) state.picked.splice(at, 1);
        else { if (state.picked.length >= 3) state.picked.shift(); state.picked.push(id); }
        buildTabs(); recard(id); return;
      }
      if (act.dataset.a === 'track') {
        setStage(id, state.stages[id] ? null : 'interested');
        if (state.view === 'saved') render_saved(); else recard(id);
        return;
      }
      if (act.dataset.a === 'ics') { saveIcs([o2], 'deadline-' + id + '.ics'); return; }
    }
  });

  function setStage(id, stage) {
    if (stage) state.stages[id] = stage; else delete state.stages[id];
    persistStages(); buildTabs();
    if (state.view === 'tracker') render_tracker();
    else if (state.view === 'discover') recard(id);
  }

  var tmr;
  $('q').addEventListener('input', function (e) {
    clearTimeout(tmr);
    var v = e.target.value.trim().toLowerCase();
    tmr = setTimeout(function () { state.q = v; render(true); }, 160);
  });
  $('sort').addEventListener('change', function (e) { state.sort = e.target.value; render(true); });
  $('adv-in').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); var v = e.target.value.trim(); if (v) advAsk(v); }
  });

  document.addEventListener('submit', function (e) {
    var f = e.target;
    if (f.id === 'prof-form') {
      e.preventDefault();
      var fd = new FormData(f);
      state.profile = {
        level: fd.get('level') || '', fields: (fd.get('fields') || '').trim(),
        countries: (fd.get('countries') || '').trim(), nationality: (fd.get('nationality') || '').trim(),
        funding: fd.get('funding') ? true : false, grad: (fd.get('grad') || '').trim()
      };
      persistProfile();
      $('prof-said').textContent = caps.db && caps.uid ? 'Saved.' : 'Applied for this session.';
      render_profile(); buildSeeds();
      return;
    }
    if (f.dataset && f.dataset.exp) {
      e.preventDefault();
      var oid = f.dataset.exp, fd2 = new FormData(f);
      var text = (fd2.get('text') || '').trim();
      if (!text || !caps.db || !caps.uid) return;
      var item = { oppId: String(oid), programme: (BY_ID[oid] || {}).t || '', year: (fd2.get('year') || '').trim(),
                   outcome: fd2.get('outcome') || '', text: text, at: new Date().toISOString() };
      var mineExps = [];
      Object.keys(state.exps).forEach(function (k) {
        (state.exps[k] || []).forEach(function (x) { if (x._own) mineExps.push(x); });
      });
      mineExps.push(item);
      (state.exps[oid] = state.exps[oid] || []).push(Object.assign({ _own: true }, item));
      write('experiences/' + caps.uid, { items: mineExps.map(function (x) {
        return { oppId: x.oppId, programme: x.programme, year: x.year, outcome: x.outcome, text: x.text, at: x.at };
      }) });
      recard(oid);
      return;
    }
  });

  /* drag and drop on the kanban; the arrow buttons do the same job on touch */
  document.addEventListener('dragstart', function (e) {
    var c = e.target.closest && e.target.closest('.kcard');
    if (c) { e.dataTransfer.setData('text/plain', c.dataset.kid); e.dataTransfer.effectAllowed = 'move'; }
  });
  document.addEventListener('dragover', function (e) {
    var col = e.target.closest && e.target.closest('.kcol');
    if (col) { e.preventDefault(); col.classList.add('drop'); }
  });
  document.addEventListener('dragleave', function (e) {
    var col = e.target.closest && e.target.closest('.kcol');
    if (col) col.classList.remove('drop');
  });
  document.addEventListener('drop', function (e) {
    var col = e.target.closest && e.target.closest('.kcol');
    if (!col) return;
    e.preventDefault(); col.classList.remove('drop');
    var id = e.dataTransfer.getData('text/plain');
    if (id && BY_ID[id]) setStage(id, col.dataset.stage);
  });

  function buildSeeds() {
    var p = state.profile;
    var seeds = p && p.fields
      ? ['Best fully funded options in ' + p.fields.split(',')[0].trim(), 'What closes in the next 30 days for me?', 'Which of these would an Indian national on a Dubai campus actually qualify for?']
      : ['I am a third-year engineering undergraduate — what should I apply to?', 'Fully funded summer research, anywhere', 'What closes in the next 30 days?'];
    $('adv-seed').innerHTML = seeds.map(function (s) {
      return '<button class="opt" type="button" data-seed="' + esc(s) + '">' + esc(s) + '</button>';
    }).join('');
  }

  /* ===== capabilities =================================================== */

  async function wire() {
    var c = window.claude;
    if (!c || !c.use) return;

    try {
      var u = await c.use('user');
      if (u) { caps.user = u; caps.uid = await u.id(); }
    } catch (e) { /* absent */ }

    try {
      var db = await c.use('db');
      if (db) {
        caps.db = db;
        if (caps.uid) {
          db.doc(mine('saved')).onSnapshot(function (s) {
            if (!s.exists) return;
            state.saved = (s.data() || {}).ids || {};
            buildTabs();
            if (state.view === 'saved') render_saved(); else if (state.view === 'discover') render(true);
          }, function () {});
          db.doc(mine('tracker')).onSnapshot(function (s) {
            if (!s.exists) return;
            state.stages = (s.data() || {}).stages || {};
            buildTabs();
            if (state.view === 'tracker') render_tracker();
          }, function () {});
          db.doc(mine('profile')).onSnapshot(function (s) {
            if (!s.exists) return;
            var d = s.data() || {};
            if (!Object.keys(d).length) return;
            state.profile = d;
            buildSeeds();
            if (state.view === 'profile') render_profile(); else if (state.view === 'discover') render(true);
          }, function () {});
        }
        db.collection('experiences').onSnapshot(function (snap) {
          var next = {};
          snap.docs.forEach(function (doc) {
            var own = doc.id === caps.uid;
            ((doc.data() || {}).items || []).forEach(function (it) {
              if (!it || !it.oppId || !it.text) return;
              (next[it.oppId] = next[it.oppId] || []).push(Object.assign({}, it, { _own: own }));
            });
          });
          state.exps = next;
          Object.keys(state.open).forEach(function (id) { if (state.open[id]) recard(id); });
        }, function () {});
      }
    } catch (e) { /* absent */ }

    try {
      var s = await c.use('sample');
      if (s) {
        caps.sample = s;
        $('adv-open').hidden = false;
        buildSeeds();
        advLine('ai', 'I can only recommend from the ' + DATA.length + ' open calls in this index, and I will name each one so you can open it. ' +
          'Tell me your degree level and field, or pick a question below.');
      }
    } catch (e) { /* absent */ }

    try {
      var d = await c.use('downloads');
      if (d) { caps.downloads = d; if (state.view === 'saved') render_saved(); }
    } catch (e) { /* absent */ }
  }

  /* ===== boot =========================================================== */

  function start(restored) {
    if (restored && restored.state) {
      Object.keys(restored.state).forEach(function (k) { if (k in state) state[k] = restored.state[k]; });
    }
    fetch('opportunities.json')
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (rows) {
        var live = [];
        rows.forEach(function (o) {
          var n = days(o.d);
          if (n !== null && n < 0) { STALE++; return; }
          live.push(o);
          BY_ID[String(o.i)] = o;
        });
        DATA = live;
        var firsts = DATA.map(function (o) { return o.fi; }).filter(Boolean).sort();
        INDEX_FROM = firsts[0] || null;
        renderStats(); buildFilters(); buildTabs(); foot();
        switchView(state.view);
        wire();
      })
      .catch(function () {
        $('results').className = '';
        $('results').innerHTML = '<div class="empty"><b>The opportunity data did not load</b>' +
          '<p>opportunities.json could not be read, so there is nothing to show. ' +
          'Republishing the page with its data file alongside it fixes this.</p></div>';
        $('stats').innerHTML = '';
      });
  }

  if (window.claude && window.claude.hot) {
    window.claude.hot.snapshot(function () {
      return { state: { view: state.view, cur: state.cur, q: state.q, sort: state.sort, open: state.open, picked: state.picked } };
    });
  }
  var hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
